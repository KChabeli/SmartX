services:
  api:
    build:
      context: .
      dockerfile: src/SmartX.Api/Dockerfile
    ports:
      - "5266:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
